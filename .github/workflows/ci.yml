name: CI
on:
  pull_request:
  push: { branches: [main] }
permissions: { contents: read }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm audit --audit-level=high --omit=dev
      - name: Team migration matches its template in both admin DBs
        run: node scripts/gen-team-migration.mjs --check
      - name: Expected admin-DB migrations list is up to date
        run: node scripts/expected-migrations.mjs --check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: No more than 12 Vercel functions (Hobby cap)
        run: |
          n=$(find api -name '*.ts' -not -path '*/_*' -not -name '*.test.ts' | wc -l)
          echo "functions: $n"; test "$n" -le 12
      - name: No service key in this app
        run: "! grep -rEn 'SERVICE_ROLE|service_role' --include=*.ts --include=*.tsx api src"
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: trufflesecurity/trufflehog@ea68ca03c865c5f324e86e849ced20ed3cf9dbbb # v3.99.8
        with: { extra_args: --only-verified }
